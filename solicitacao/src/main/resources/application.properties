quarkus.http.host=0.0.0.0
quarkus.http.port=8081

quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=app
quarkus.datasource.password=app
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/solicitacao_cartao_db
quarkus.datasource.jdbc.max-size=10

quarkus.hibernate-orm.schema-management.strategy=drop-and-create
quarkus.hibernate-orm.sql-load-script=no-file
quarkus.hibernate-orm.log.sql=false

############### PRODUCER KAFKA ###############

kafka.bootstrap.servers=localhost:9092

mp.messaging.outgoing.solicitacao-criada.connector=smallrye-kafka
mp.messaging.outgoing.solicitacao-criada.topic=cartao.solicitado
mp.messaging.outgoing.solicitacao-criada.value.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.solicitacao-criada.acks=all
mp.messaging.outgoing.solicitacao-criada.enable.idempotence=true
# Tempos menores que o timeout do envio no publisher: a falha é reportada
# antes do @Retry, sem deixar envios pendentes em segundo plano.
mp.messaging.outgoing.solicitacao-criada.linger.ms=0
mp.messaging.outgoing.solicitacao-criada.max.block.ms=2000
mp.messaging.outgoing.solicitacao-criada.request.timeout.ms=1500
mp.messaging.outgoing.solicitacao-criada.delivery.timeout.ms=2000

############### CONSUMER KAFKA ###############

mp.messaging.incoming.cartao-emitido.connector=smallrye-kafka
mp.messaging.incoming.cartao-emitido.topic=cartao.emitido
mp.messaging.incoming.cartao-emitido.group.id=solicitacao-cartao-emitido
mp.messaging.incoming.cartao-emitido.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.cartao-emitido.auto.offset.reset=earliest

mp.messaging.incoming.cartao-emitido.failure-strategy=dead-letter-queue
mp.messaging.incoming.cartao-emitido.dead-letter-queue.topic=cartao.dlt

# SWAGGER - http://localhost:8081/q/swagger-ui
