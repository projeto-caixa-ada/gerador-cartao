quarkus.http.port=8083

quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=app
quarkus.datasource.password=app
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5433/emissao_cartao_db
quarkus.datasource.jdbc.max-size=10

quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.hibernate-orm.sql-load-script=no-file
quarkus.hibernate-orm.log.sql=false

kafka.bootstrap.servers=localhost:9092

############### CONSUMER ###############

mp.messaging.incoming.cartao-solicitado.connector=smallrye-kafka
mp.messaging.incoming.cartao-solicitado.topic=cartao.solicitado
mp.messaging.incoming.cartao-solicitado.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.cartao-solicitado.auto.offset.reset=earliest

############### PRODUCER ###############

mp.messaging.outgoing.cartao-emitido.connector=smallrye-kafka
mp.messaging.outgoing.cartao-emitido.topic=cartao.emitido
mp.messaging.outgoing.cartao-emitido.value.serializer=org.apache.kafka.common.serialization.StringSerializer

mp.messaging.incoming.cartao-solicitado.failure-strategy=dead-letter-queue
mp.messaging.incoming.cartao-solicitado.dead-letter-queue.topic=cartao.dlt

quarkus.log.category."io.smallrye.reactive.messaging.provider".level=OFF

# SWAGGER - http://localhost:8083/q/swagger-ui

############### REDIS ###############

quarkus.redis.hosts=redis://localhost:6379