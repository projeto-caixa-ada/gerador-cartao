quarkus.http.port=8083

quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=app
quarkus.datasource.password=app
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/emissao_cartao_db
quarkus.datasource.jdbc.max-size=10

quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.hibernate-orm.sql-load-script=no-file
quarkus.hibernate-orm.log.sql=false

kafka.bootstrap.servers=localhost:9092

############### CONSUMER ###############

mp.messaging.incoming.solicitacao-validada.connector=smallrye-kafka
mp.messaging.incoming.solicitacao-validada.topic=solicitacao.cartao.validada
mp.messaging.incoming.solicitacao-validada.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.solicitacao-validada.auto.offset.reset=earliest

############### PRODUCER ###############

mp.messaging.outgoing.cartao-emitido.connector=smallrye-kafka
mp.messaging.outgoing.cartao-emitido.topic=cartao.emitido
mp.messaging.outgoing.cartao-emitido.value.serializer=org.apache.kafka.common.serialization.StringSerializer


